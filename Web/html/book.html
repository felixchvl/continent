<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continent</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <div class="desktopNav"> 
            <nav>
                <a href="index.html">
                    <img class="Logo" src="img/logo.svg" alt="Logo">
                </a>
                <a href="index.html"><h1>Continent</h1></a>
                <a href="https://openrailwaymap.org">Network status</a>
                <a href="register.html">Account</a>
                <a href="about.html">About</a>
            </nav>
        </div>
        <!--  MOBILE NAV BAR -->
    <div class="hamburger">
        <input class="hidden" id="drawer-input" type="checkbox">
        <label for="drawer-input" class="drawer-open">
          <span></span>
        </label>
        <nav class="nav-content">
          <ul class="items">
            <li class="item">
                <a href="index.html">Continent</a>
            </li>
            <li class="item">
                <a href="https://openrailwaymap.org">Network status</a>
            </li>
            <li class="item">
                <a href="register.html">Account</a>
            </li>
            <li class="item">
                <a href="about.html">About</a>
            </li>
          </ul>
        </nav>
      </div>
        </header>

    <hr>
    
    <div class="resu">
        <div class="resuLocation">
            <div><span id="fromCity"></span></div>
            <img class="row" src="../html/img/row.svg" alt="Row" />
            <div><span id="toCity"></span></div>
        </div>

        <div class="resuDate">
            <div class="dateEntry">
                <span class="dateLabel">Out:</span>
                <div class="dateTimeContainer">
                    <span id="departureTime"></span>
                </div>
            </div>

            <div class="dateEntry">
                <span class="dateLabel">Return:</span>
                <div class="dateTimeContainer">
                    <span id="returnTime"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="bookMain" id="bookMain">
        <!-- Les tickets qui s'ajoutent là -->
    </div>

    <footer>
        <div class="txtFooter">Laurens & Chevalier Associates</div>
    </footer>

    <script>
        function formatDate(dateTimeString) {
            const dateTime = new Date(dateTimeString);
            const date = dateTime.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
            const time = dateTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            return date + ' <img src="../html/img/dot.svg" alt="dot" class="timeSeparator"/> ' + time;
        }

        document.getElementById('fromCity').textContent = localStorage.getItem('fromCity');
        document.getElementById('toCity').textContent = localStorage.getItem('toCity');
        document.getElementById('departureTime').innerHTML = formatDate(localStorage.getItem('departureTime'));
        document.getElementById('returnTime').innerHTML = formatDate(localStorage.getItem('returnTime'));

        document.addEventListener('DOMContentLoaded', function() {
            const logos = [
                '../html/img/eurostar_logo.svg',
                '../html/img/deutsche_bahn_logo.svg',
                '../html/img/nederlandse_spoorwegen_logo.svg',
                '../html/img/renfe_logo.svg',
                '../html/img/sncf_logo.svg',
                '../html/img/trenitalia_logo.svg'
            ];

            const baseTime = new Date(localStorage.getItem('departureTime'));
            const tickets = [];

            for (let i = 0; i < 4; i++) {
                const randomMinutesToAddForDeparture = Math.floor(Math.random() * 116) + 5;
                const departureTime = new Date(baseTime.getTime() + randomMinutesToAddForDeparture * 60000);
                const randomMinutesToAddForArrival = Math.floor(Math.random() * 106) + 105;
                const arrivalTime = new Date(departureTime.getTime() + randomMinutesToAddForArrival * 60000);
                const randomLogoIndex = Math.floor(Math.random() * logos.length);
                const randomPrice = Math.floor(Math.random() * (131 - 60) + 60);

                tickets.push({
                    departure: departureTime,
                    arrival: arrivalTime,
                    logo: logos[randomLogoIndex],
                    price: `${randomPrice}€`
                });
            }


            tickets.sort((a, b) => a.departure - b.departure);


            const bookMain = document.getElementById('bookMain');
            tickets.forEach(ticket => {
                const ticketDiv = document.createElement('div');
                ticketDiv.classList.add('ticket');
                ticketDiv.innerHTML = `
                    <div class="ticket-time">
                        <span class="departure">${ticket.departure.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })}</span>
                        <img src="../html/img/row.svg" alt="Row" class="row-icon"/>
                        <span class="arrival">${ticket.arrival.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })}</span>
                    </div>
                    <div class="ticket-logo">
                        <img src="${ticket.logo}" alt="Company Logo" class="company-logo"/>
                    </div>
                    <div class="ticket-price">
                        <span class="price">${ticket.price}</span>
                    </div>
                `;
                bookMain.appendChild(ticketDiv);

                const ligneBDiv = document.createElement('div');
                ligneBDiv.classList.add('ligneB');
                bookMain.appendChild(ligneBDiv);
            });
        });
    </script>
</body>

</html>
